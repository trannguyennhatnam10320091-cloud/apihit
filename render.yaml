services:
  - type: web
    name: hit-api-v9-follow-previous-1-1
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: POLL_INTERVAL
        value: 1500
      - key: REQUEST_TIMEOUT
        value: 8000
      - key: MIN_HISTORY
        value: 1
      - key: MAX_ENGINE_HISTORY
        value: 240
      - key: MAX_RUNTIME_HISTORY
        value: 10000
      - key: ADMIN_ACTION_TOKEN
        sync: false
